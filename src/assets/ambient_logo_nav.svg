<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 46" role="img">
  <title>Ambient</title>
  <defs>
    <radialGradient id="nav-orb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0eaff"/>
      <stop offset="35%" stop-color="#b89fff"/>
      <stop offset="75%" stop-color="#6637d6"/>
      <stop offset="100%" stop-color="#2a0e70"/>
    </radialGradient>
    <radialGradient id="nav-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#5a28c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0a50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nav-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8855ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4422aa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="nav-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede4ff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bba4f5"/>
    </linearGradient>
  </defs>

  <!-- Outer pulse ring -->
  <circle cx="23" cy="23" r="22" fill="none" stroke="url(#nav-ring)" stroke-width="1"/>

  <!-- Halo bloom -->
  <circle cx="23" cy="23" r="21" fill="url(#nav-halo)"/>

  <!-- Orb -->
  <circle cx="23" cy="23" r="16" fill="url(#nav-orb)"/>

  <!-- Specular highlight -->
  <ellipse cx="18" cy="17" rx="5" ry="3" fill="white" opacity="0.18"/>

  <!-- Waveform bars centered at (23, 23) -->
  <g transform="translate(23,23)" opacity="0.92">
    <rect x="-13" y="-3.5" width="3" height="7"  rx="1.5" fill="white" opacity="0.45"/>
    <rect x="-8.5" y="-6.5" width="3" height="13" rx="1.5" fill="white" opacity="0.62"/>
    <rect x="-4"   y="-8.5" width="3" height="17" rx="1.5" fill="white" opacity="0.78"/>
    <rect x="0.5"  y="-10.5" width="3" height="21" rx="1.5" fill="white" opacity="1.0"/>
    <rect x="5"    y="-8.5" width="3" height="17" rx="1.5" fill="white" opacity="0.78"/>
    <rect x="9.5"  y="-6.5" width="3" height="13" rx="1.5" fill="white" opacity="0.62"/>
    <rect x="14"   y="-3.5" width="3" height="7"  rx="1.5" fill="white" opacity="0.45"/>
  </g>

  <!-- AMBIENT wordmark -->
  <text
    x="50" y="31"
    fill="url(#nav-text)"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="22"
    font-weight="700"
    letter-spacing="0.04em"
  >AMBIENT</text>
</svg>
