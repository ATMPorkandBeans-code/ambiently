<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 270" width="100%" role="img" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Ambient App Logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo for Ambient, a soundscape app for sleep and focus. A glowing orb with waveform bars on the left, with AMBIENT wordmark and tagline on the right, on a deep navy-to-purple background.</desc>

  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0d3e"/>
      <stop offset="100%" stop-color="#060918"/>
    </radialGradient>

    <radialGradient id="orb-core" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0eaff"/>
      <stop offset="35%" stop-color="#b89fff"/>
      <stop offset="75%" stop-color="#6637d6"/>
      <stop offset="100%" stop-color="#2a0e70"/>
    </radialGradient>

    <radialGradient id="halo-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5a28c4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0a50" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede4ff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bba4f5"/>
    </linearGradient>

    <linearGradient id="tag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9070cc"/>
      <stop offset="100%" stop-color="#c4a8f8"/>
    </linearGradient>

    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9070cc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c4a8f8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ring1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8855ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4422aa" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="ring2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6633cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#331188" stop-opacity="0.03"/>
    </linearGradient>

    <clipPath id="logo-clip">
      <rect x="0" y="0" width="680" height="260" rx="24" ry="24"/>
    </clipPath>


  <mask id="imagine-text-gaps-ztq52v" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="690" height="270" fill="white"/><rect x="214" y="99.09090423583984" width="384.58380126953125" height="72.18181610107422" fill="black" rx="2"/><rect x="215.99998474121094" y="173.5454559326172" width="343.14202880859375" height="18.090909004211426" fill="black" rx="2"/></mask></defs>

